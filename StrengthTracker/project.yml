name: StrengthTracker
options:
  bundleIdPrefix: se.gunnarstrandberg.hellbent
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  StrengthTrackerPackage:
    path: .

targets:
  StrengthTracker:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "**/.placeholder.swift"
          - "WidgetExtension/**"
    dependencies:
      - package: StrengthTrackerPackage
        product: StrengthTrackerShared
      - target: StrengthTrackerWatch
        embed: true
      - target: StrengthTrackerWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: iOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: se.gunnarstrandberg.hellbent.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: true
    entitlements:
      path: iOS/Resources/StrengthTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.se.gunnarstrandberg.hellbent.shared
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: HellBentIron
        CFBundleName: HellBentIron
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHealthShareUsageDescription: "HellBentIron reads your workout data to display history and progress."
        NSHealthUpdateUsageDescription: "HellBentIron saves your strength training workouts to Apple Health."

  StrengthTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - "**/.placeholder.swift"
    dependencies:
      - package: StrengthTrackerPackage
        product: StrengthTrackerShared
    settings:
      base:
        INFOPLIST_FILE: WatchApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: se.gunnarstrandberg.hellbent.ios.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    entitlements:
      path: WatchApp/Resources/StrengthTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.se.gunnarstrandberg.hellbent.shared
    info:
      path: WatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: HellBentIron
        CFBundleName: HellBentIron Watch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: se.gunnarstrandberg.hellbent.ios
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "HellBentIron reads your workout and heart rate data to display real-time metrics during workouts."
        NSHealthUpdateUsageDescription: "HellBentIron saves your strength training workouts to Apple Health."

  StrengthTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/WidgetExtension
    dependencies:
      - package: StrengthTrackerPackage
        product: StrengthTrackerShared
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: se.gunnarstrandberg.hellbent.ios.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HellBentIron Widgets
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/WidgetExtension/StrengthTrackerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.se.gunnarstrandberg.hellbent.shared

  StrengthTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/.placeholder.swift"
    dependencies:
      - package: StrengthTrackerPackage
        product: StrengthTrackerShared
      - target: StrengthTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.gunnarstrandberg.hellbent.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StrengthTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StrengthTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  StrengthTracker:
    build:
      targets:
        StrengthTracker: all
        StrengthTrackerWatch: all
        StrengthTrackerWidgets: all
        StrengthTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrengthTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
